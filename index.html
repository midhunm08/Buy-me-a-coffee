<style>
  /* ============ EDIT ME — all changeable text lives in CONFIG below ============ */
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#2b2118; --muted:#7a6a58;
    --accent:#b4702a; --accent-dark:#8f571f; --line:#e9ddc9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
  .wrap{width:100%;max-width:520px}
  header{text-align:center;margin-bottom:20px}
  header .cup{font-size:52px}
  h1{font-size:1.9em;margin:6px 0 4px}
  .sub{color:var(--muted);font-size:1.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 4px 18px rgba(120,85,30,.07)}
  .card h2{font-size:1.15em;margin-bottom:10px}
  .projects{display:flex;flex-wrap:wrap;gap:10px}
  .proj{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.95em;text-decoration:none;color:var(--ink);background:#fffdf8}
  .proj:hover{border-color:var(--accent)}
  .proj span{color:var(--muted);font-size:.85em}
  .qrbox{text-align:center}
  .qrbox img{width:min(280px,72vw);height:auto;border:10px solid #fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .qrnote{color:var(--muted);font-size:.9em;margin-top:10px}
  .upirow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .upiid{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f4ecdd;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:1em;word-break:break-all}
  .btn{display:inline-block;border:none;cursor:pointer;border-radius:12px;padding:13px 22px;font-size:1.02em;font-weight:600;text-decoration:none;text-align:center}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent)}
  .btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .btnrow .btn{flex:1 1 180px}
  .paylist{list-style:none}
  .paylist li{margin:8px 0}
  .paylist a{color:var(--accent-dark);font-weight:600}
  footer{margin-top:26px;color:var(--muted);font-size:.88em;text-align:center}
  .copied{color:#2e7d32;font-size:.9em;min-height:1.4em;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="cup">☕</div>
    <h1>Buy me a coffee</h1>
    <p class="sub" id="tagline"></p>
  </header>

  <div class="card">
    <h2>My projects</h2>
    <div class="projects" id="projects"></div>
  </div>

  <div class="card qrbox">
    <h2 style="text-align:left">Scan &amp; pay</h2>
    <img id="qr" alt="UPI QR code">
    <p class="qrnote">Scan with GPay, PhonePe, Paytm, BHIM or any UPI app</p>
    <div class="upirow">
      <span class="upiid" id="upiid"></span>
    </div>
    <div class="btnrow">
      <a class="btn btn-primary" id="paybtn" href="#">Pay via UPI app</a>
      <button class="btn btn-ghost" id="copybtn" type="button">Copy UPI ID</button>
    </div>
    <p class="copied" id="copied"></p>
  </div>

  <div class="card">
    <h2>Other ways to pay</h2>
    <ul class="paylist" id="otherpay"></ul>
  </div>

  <footer id="footer"></footer>
</div>
